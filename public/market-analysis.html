    <style>
        @font-face {
            font-family: dana;
            font-style: normal;
            font-weight: normal;
            font-display: swap;
            src: url('./fonts/Dana-Regular.woff2') format('woff2');
        }

        @font-face {
            font-family: dana;
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('./fonts/Dana-Medium.woff2') format('woff2');
        }

        @font-face {
            font-family: dana;
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('./fonts/Dana-DemiBold.woff2') format('woff2');
        }

        @font-face {
            font-family: dana;
            font-style: normal;
            font-weight: bold;
            font-display: swap;
            src: url('./fonts/Dana-Bold.woff2') format('woff2');
        }

        :root {
            --purple: #500878;
            --gold: #ffc72c;
            --card-light: #e9e6f1;
            --ink-soft: #6b5a8c;
            --supply: #e23b3b;
            --demand: #2fae5f;
            --white: #ffffff;
            --black: #231f20;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { font-size: calc(min(100vw, 66.66vh) * 0.024); }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: dana, 'Vazirmatn', sans-serif;
            background: var(--white);
            color: var(--white);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 0.9rem;
            padding: 2.4rem 4rem 1.8rem;
        }

        .logo {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            flex: 0 0 auto;
            align-self: center;
        }

        .logo svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo__subtitle {
            font-size: 1.6rem;
            font-weight: 400;
            color: #000;
            margin-top: 0.35rem;
            margin-bottom: 0;
        }

        .card {
            color: #231f20;
            width: 100%;
            flex: 0 0 auto;
            border-radius: 1.15rem;
            padding: 1.35rem 2rem;
            text-align: center;
        }

        .card--buy {
            background: var(--purple);
            color: var(--white);
        }

        .card--sell {
            background: var(--card-light);
            color: var(--black);
        }

        .card__label {
            font-size: 2rem;
            line-height: 1.2;
            font-weight: 400;
            margin-bottom: 0.45rem;
        }

        .card__price {
            font-size: 2.9rem;
            line-height: 1.1;
            font-weight: 600;
            letter-spacing: 0.02em;
            direction: ltr;
            unicode-bidi: plaintext;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .card__price.flash {
            transform: scale(1.06);
        }

        /* --- odometer (rolling digits) --- */
        .odo {
            --odo-h: 1.2em;
            --odo-w: 0.62em;
            display: inline-flex;
            align-items: stretch;
            direction: ltr;
            unicode-bidi: isolate;
            line-height: 1;
        }

        .odo__sep {
            display: block;
            height: var(--odo-h);
            line-height: var(--odo-h);
        }

        .odo__digit {
            display: block;
            width: var(--odo-w);
            height: var(--odo-h);
            overflow: hidden;
        }

        .odo__strip {
            display: block;
            will-change: transform;
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .odo__cell {
            display: block;
            height: var(--odo-h);
            line-height: var(--odo-h);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .odo__strip {
                transition: none;
            }
        }

        .card--gauge {
            background: var(--card-light);
            color: var(--ink);
            padding: 1.4rem 2rem 1.6rem;
        }

        .gauge__title {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--black);
        }

        .gauge__svg {
            width: 58%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .gauge__arc {
            fill: none;
            stroke: url(#gaugeGrad);
            stroke-width: 26;
            stroke-linecap: round;
        }

        .gauge__needle,
        .gauge__hub {
            fill: #2b2b2b;
        }

        .gauge__needle { opacity: 1; }

        .gauge__hub-dot {
            fill: #f3f1f8;
        }

        #needle {
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .gauge__row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
            margin-top: -1rem;
            padding: 0 2.2rem;
        }

        .gauge__supply,
        .gauge__demand,
        .gauge__center {
            font-size: 1.3rem;
            font-weight: 500;
        }

        .gauge__supply {
            color: var(--supply);
        }

        .gauge__demand {
            color: var(--demand);
        }

        .gauge__center {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge__value {
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1;
            color: #d58a02;
        }

        .gauge__state {
            font-size: 1rem;
            font-weight: 500;
            color: #d58a02;
        }

        .gauge__desc {
            margin-top: 0.75rem;
            font-size: 1.25rem;
            line-height: 1.7;
            color: var(--black);
            text-align: center;

            justify-content: space-around;
            padding: 0.7rem 2.2rem;
            font-size: 1.75rem;
            font-weight: 400;
        }

        .card--update .time {
            direction: rtl;
            unicode-bidi: plaintext;
        }

        .brand {

            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 300;

            letter-spacing: 0.04em;

        .brand__line {
            width: 62%;
            height: 0.1rem;
            margin: 0.45rem 0;
            background: var(--purple);

                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .gauge__svg {
                width: 46%;
            }

    <script>
        const API_URL = '/api/market-price';

        const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

        function toPersianDigits(value) {
            return value
                .toString()
                .replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                .replace(/\d/g, (d) => PERSIAN_DIGITS[d]);
        }

        /* ---- odometer: only the digits that changed roll vertically ---- */
        const ODO_BASE_MS = 420;    // duration of a single-step roll
        const ODO_STEP_MS = 45;     // extra duration per additional digit passed through
        const ODO_STAGGER_MS = 35;  // each digit starts slightly after the one on its right

        let odoDigitWidthEm = null;

        function groupThousands(value) {
            return Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function measureDigitWidth(sample) {
            const probe = document.createElement('span');
            probe.className = 'odo__cell';
            probe.style.position = 'absolute';
            probe.style.visibility = 'hidden';
            sample.appendChild(probe);
            let max = 0;
            for (const d of PERSIAN_DIGITS) {
                probe.textContent = d;
                max = Math.max(max, probe.getBoundingClientRect().width);
            }
            const fontSize = parseFloat(getComputedStyle(sample).fontSize);
            probe.remove();
            return max > 0 && fontSize > 0 ? max / fontSize : 0.62;
        }

        function applyDigitWidth(root) {
            if (odoDigitWidthEm === null) odoDigitWidthEm = measureDigitWidth(root);
            root.style.setProperty('--odo-w', odoDigitWidthEm.toFixed(4) + 'em');
        }

        function createDigitCell() {
            const cell = document.createElement('span');
            cell.className = 'odo__digit';
            const strip = document.createElement('span');
            strip.className = 'odo__strip';
            cell.appendChild(strip);
            cell.strip = strip;
            cell.digit = null;
            return cell;
        }

        // Rebuilds the strip as the exact run of digits between the old and the new
        // value (e.g. 8 -> 2 upwards becomes 8,9,0,1,2) and slides it to the last one.
        function setDigit(cell, digit, direction, animate, order) {
            if (cell.digit === digit) return;

            const seq = [];
            if (!animate || cell.digit === null) {
                seq.push(digit);
            } else {
                let d = cell.digit;
                seq.push(d);
                while (d !== digit) {
                    d = direction < 0 ? (d + 9) % 10 : (d + 1) % 10;
                    seq.push(d);
                }
            }

            const strip = cell.strip;
            strip.textContent = '';
            for (const d of seq) {
                const c = document.createElement('span');
                c.className = 'odo__cell';
                c.textContent = PERSIAN_DIGITS[d];
                strip.appendChild(c);
            }

            const steps = seq.length - 1;
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0)';
            void strip.offsetHeight; // flush, so the roll starts on the previous digit
            strip.style.transition = '';
            strip.style.transitionDuration = (ODO_BASE_MS + Math.max(0, steps - 1) * ODO_STEP_MS) + 'ms';
            strip.style.transitionDelay = (order * ODO_STAGGER_MS) + 'ms';
            strip.style.transform = 'translateY(' + (-steps * 100 / seq.length) + '%)';

            cell.digit = digit;
        }

        function setOdometer(el, value) {
            const text = groupThousands(value);
            const direction = el.odoValue == null || value >= el.odoValue ? 1 : -1;
            const sameShape = el.odoText != null && el.odoText.length === text.length;

            if (!sameShape) {
                const root = document.createElement('span');
                root.className = 'odo';
                el.cells = [];
                for (const ch of text) {
                    if (ch >= '0' && ch <= '9') {
                        const cell = createDigitCell();
                        setDigit(cell, +ch, 1, false, 0);
                        root.appendChild(cell);
                        el.cells.push(cell);
                    } else {
                        const sep = document.createElement('span');
                        sep.className = 'odo__sep';
                        sep.textContent = ch;
                        root.appendChild(sep);
                    }
                }
                el.textContent = '';
                el.appendChild(root);
                applyDigitWidth(root);
            } else {
                const digits = text.replace(/\D/g, '');
                for (let i = digits.length - 1; i >= 0; i--) {
                    setDigit(el.cells[i], +digits[i], direction, true, digits.length - 1 - i);
                }
            }

            el.odoText = text;
            el.odoValue = value;
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                odoDigitWidthEm = null;
                document.querySelectorAll('.odo').forEach(applyDigitWidth);
            });
        }

        function sentimentState(value) {
            if (value < 35) return 'عرضه شدید';
            if (value <= 65) return 'متعادل';
            return 'تقاضای شدید';
        }

        function flash(el) {
            el.classList.add('flash');
            setTimeout(() => el.classList.remove('flash'), 350);
        }

        const state = { lastBuy: null, updatedAt: null };

        // When the price itself was last updated, taken from the API response.
        // The age is measured against the server's own clock (the response `Date` header),
        // so a skewed clock on the display machine can't distort the label.
        function parseUpdatedAt(gold, serverNow) {
            const d = (gold && gold.date) || {};
            const t = Date.parse(d.utc_timestamp || d.datetime_full || '');
            if (!isFinite(t)) return null;
            return Date.now() - Math.max(0, serverNow - t);
        }

        function relativeTime(since) {
            const secs = Math.max(0, Math.floor((Date.now() - since) / 1000));
            if (secs < 60) return toPersianDigits(secs + 1) + ' ثانیه قبل';
            const mins = Math.floor(secs / 60);
            if (mins < 60) return toPersianDigits(mins) + ' دقیقه قبل';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return toPersianDigits(hours) + ' ساعت قبل';
            return toPersianDigits(Math.floor(hours / 24)) + ' روز قبل';
        }

        function renderUpdatedAt() {
            if (state.updatedAt === null) return;
            const el = document.getElementById('update');
            const text = relativeTime(state.updatedAt);
            if (el.textContent !== text) el.textContent = text;
        }

        function render(gold) {
            const buyEl = document.getElementById('buyGram');
            const sellEl = document.getElementById('sellGram');

            setOdometer(buyEl, gold.price.sell * 1000);
            setOdometer(sellEl, gold.price.buy * 1000);
            flash(buyEl);
            flash(sellEl);
        }

        async function getData() {
            try {
                const res = await fetch(API_URL);
                const serverNow = Date.parse(res.headers.get('date') || '') || Date.now();
                const data = await res.json();
                const gold = data.prices.find((p) => p.symbol === 'GOLD18');
                if (!gold) return;

                const updatedAt = parseUpdatedAt(gold, serverNow);
                if (updatedAt !== null) {
                    state.updatedAt = updatedAt;
                    renderUpdatedAt();
                }

                if (state.lastBuy === gold.price.buy) return;
                state.lastBuy = gold.price.buy;
                render(gold);
            } catch (e) {
                // keep last shown values on network errors
            }
        }

        getData();
        setInterval(getData, 5000);

        // Re-check the elapsed label every 5s; it only rewrites the element when the
        // rendered text actually differs (e.g. ۵۰ ثانیه قبل -> ۱ دقیقه قبل).
        setInterval(renderUpdatedAt, 1000);

        // Full page refresh every 5 minutes, so a long-running wall display stays healthy.
        setTimeout(() => location.reload(), 5 * 60 * 1000);

        const SENTIMENT_URL = '/api/market-sentiment';
        const sentiment = { lastGet: null };

        function applySentiment(getPct) {
            const v = Math.max(0, Math.min(100, getPct));
            document.getElementById('sentimentValue').textContent = toPersianDigits(v);
            document.getElementById('sentimentState').textContent = sentimentState(v);
            const angle = (v - 50) * 1.8;
            const needle = document.getElementById('needle');
            needle.style.opacity = '1';
            needle.setAttribute('transform', `rotate(${angle} 120 128)`);
        }

        async function getSentiment() {
            try {
                const res = await fetch(SENTIMENT_URL);
                const json = await res.json();
                const raw = json && json.data && json.data.get;
                const v = parseInt(raw, 10);
                if (isNaN(v)) return; // no valid data -> keep previous value
                sentiment.lastGet = v;
                applySentiment(v);
            } catch (e) {
                // request failed -> keep showing the previous value
            }
        }

        getSentiment();
        setInterval(getSentiment, 5000);
    </script>


</body></html>
